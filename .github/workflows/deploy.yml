name: Build Docker et deploiement GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1 : Construction et envoi de l'image Docker
  build-and-push:
    name: Build et Push Docker
    runs-on: ubuntu-latest

    # On ne pousse pas d'image lors d'une pull request
    if: github.event_name != 'pull_request'

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Se connecter a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et envoyer l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: TON_PSEUDO_DOCKER/hello-world-tp:${{ github.sha }}

  # JOB 2 : Extraction du fichier HTML depuis le conteneur
  extract-html:
    name: Extraction du HTML
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Se connecter a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Telecharger l'image Docker
        run: |
          docker pull TON_PSEUDO_DOCKER/hello-world-tp:${{ github.sha }}

      - name: Creer un conteneur temporaire
        run: |
          docker create --name extraction \
            TON_PSEUDO_DOCKER/hello-world-tp:${{ github.sha }}

      - name: Extraire le fichier HTML
        run: |
          mkdir public
          docker cp extraction:/usr/share/nginx/html/index.html public/index.html
          docker rm extraction

      - name: Envoyer le fichier HTML comme artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # JOB 3 : Deploiement sur GitHub Pages
  deploy:
    name: Deploiement GitHub Pages
    runs-on: ubuntu-latest
    needs: extract-html

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
